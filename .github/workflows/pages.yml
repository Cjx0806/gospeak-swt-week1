name: 发布 GoSpeak SWT 网站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 读取仓库
        uses: actions/checkout@v4
      - name: 解压网站
        run: mkdir _site && unzip -q gospeak-swt-week1-clean.zip -d _site
      - name: 生成月底口测句子课与连段训练
        run: |
          python -m pip install -q edge-tts
          python <<'PYAPP'
          import asyncio
          import re
          from pathlib import Path
          import edge_tts

          # 真实资料补丁：统一月底主线、每日监督、句子课和录音评测所读取的数据。
          bundle_replacements = [
              ("{pattern:`主语＋系动词＋表语`,parts:[{role:`主语`,text:`My summer break`,meaning:`我的暑假`},{role:`系动词`,text:`is`,meaning:`是`},{role:`表语`,text:`from June to September`,meaning:`从六月到九月`},{role:`定语`,text:`My / summer`,meaning:`共同修饰 break`}],note:`from A to B 是固定结构，表示“从 A 到 B”。`}", "{pattern:`主语＋系动词＋表语`,parts:[{role:`主语`,text:`My training`,meaning:`我的专业学习`},{role:`系动词`,text:`is`,meaning:`是`},{role:`表语`,text:`about safe exercise, fitness, and teamwork`,meaning:`关于安全锻炼、体能和团队合作`},{role:`定语`,text:`My`,meaning:`修饰 training`}],note:`about 后面说明专业学习包含的内容；三个并列名词用逗号和 and 连接。`}"),
              ("{pattern:`主语＋系动词＋表语`,parts:[{role:`主语`,text:`I`,meaning:`我`},{role:`系动词`,text:`am`,meaning:`是`},{role:`表语`,text:`a full-time student`,meaning:`一名全日制学生`},{role:`定语`,text:`full-time`,meaning:`修饰 student`}],note:`full-time 是复合形容词，放在名词 student 前面作定语。`}", "{pattern:`主语＋系动词＋表语`,parts:[{role:`主语`,text:`I`,meaning:`我`},{role:`系动词`,text:`am`,meaning:`是`},{role:`表语`,text:`a first-year student`,meaning:`一名大一学生`},{role:`定语`,text:`first-year`,meaning:`修饰 student，表示大一`}],note:`first-year 是复合形容词，放在 student 前说明年级。`}"),
