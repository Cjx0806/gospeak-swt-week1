              (",alex:`亚历克斯（示范名）`", ""),
              (",alex:`ˈælɪks`", ""),
          ]
          bundle_changed = 0
          for asset in Path('_site/assets').glob('*.js'):
              original = asset.read_text(encoding='utf-8')
              text = original
              for old, new in bundle_replacements:
                  text = text.replace(old, new)
              if text != original:
                  asset.write_text(text, encoding='utf-8')
                  bundle_changed += 1
          if bundle_changed == 0:
              raise RuntimeError('未找到课程数据包，真实资料补丁没有生效')
          forbidden = ['My major is business.', '我的专业是商科。', 'Sports and Arts Performance', '体育艺术表演', 'My major is sports training.', '我的专业是运动训练。']
