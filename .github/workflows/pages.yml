name: Deploy GoSpeak V19.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack verified static release and auditable source
        run: |
          mkdir -p _site
          unzip -q -o gospeak-v19-site.zip -d _site
          unzip -q -o gospeak-v19-listening-modules.zip -d _site
          unzip -q -o gospeak-v19-listening-collections.zip -d _site
          unzip -q -o gospeak-v19-source.zip -d .
          unzip -q -o gospeak-v19-update.zip -d .
          touch _site/.nojekyll
      - name: Validate curriculum, all audio and recorder behavior
        run: |
          python -m pip install mutagen==1.48.1
          python scripts/verify_v19.py _site
          node --check _site/assets/mainline-v19.js
          node --check _site/assets/recorder-v19.js
          node --check _site/assets/listening-v18.js
          node scripts/test_recorder_v19.cjs
          node scripts/test_recorder_lifecycle_v19.cjs
          node scripts/test_mainline_v19.cjs
          node scripts/test_mainline_stability.cjs
          node scripts/test_listening_stability.cjs
          node scripts/test_recorder_stability.cjs
          node scripts/test_legacy_audio_stability.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
