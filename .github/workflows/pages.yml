name: 发布 GoSpeak SWT 网站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 读取仓库
        uses: actions/checkout@v4
      - name: 解压网站
        run: mkdir _site && unzip -q gospeak-swt-week1-clean.zip -d _site
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
