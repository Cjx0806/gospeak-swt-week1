              ("Hello, my name is Alex, and I am a college student from China.", "Hello, my name is Junxi. I am a first-year student at Guangxi College for Preschool Education."),
              ("你好，我叫 Alex，是一名来自中国的大学生。", "你好，我叫俊熙。我是广西幼儿师范高等专科学校的大一学生。"),
