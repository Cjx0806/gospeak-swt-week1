                recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordings[key])URL.revokeObjectURL(recordings[key]);recordings[key]=URL.createObjectURL(new Blob(recChunks,{type:recorder.mimeType||'audio/webm'}));recordingKey='';document.getElementById('mainline-drill').innerHTML=panel();};
