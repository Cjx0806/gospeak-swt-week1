name: Deploy 快乐出村计划 V36

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack verified static release and auditable source
        run: |
          mkdir -p _site
          unzip -q -o gospeak-v19-site.zip -d _site
          unzip -q -o gospeak-v19-listening-modules.zip -d _site
          unzip -q -o gospeak-v19-listening-collections.zip -d _site
          unzip -q -o gospeak-v19-source.zip -d .
          unzip -q -o gospeak-v19-update.zip -d .
          unzip -q -o gospeak-v20-update.zip -d .
          unzip -q -o gospeak-v21-update.zip -d .
          unzip -q -o gospeak-v22-update.zip -d .
          unzip -q -o gospeak-v23-update.zip -d .
          unzip -q -o gospeak-v24-update.zip -d .
          unzip -q -o gospeak-v25-update.zip -d .
          unzip -q -o gospeak-v26-update.zip -d .
          unzip -q -o gospeak-v27-update.zip -d .
          unzip -q -o gospeak-v28-update.zip -d .
          unzip -q -o gospeak-v29-update.zip -d .
          unzip -q -o gospeak-v30-update.zip -d .
          touch _site/.nojekyll
      - name: Validate curriculum, all audio and recorder behavior
        run: |
          python -m pip install mutagen==1.48.1
          python scripts/verify_v22.py _site
          python scripts/verify_cards_v24.py
          node --check _site/assets/cards-v24.js
          python scripts/test_week3_v22.py
          python scripts/test_interview_supplement_v22.py
          node scripts/test_lesson_recognition_v22.cjs
          node scripts/test_mainline_v22.cjs
          node scripts/test_core_v22.cjs
          node scripts/test_listening_first_v22.cjs
          node scripts/test_mainline_v25.cjs
          node scripts/test_language_v29.cjs
          node scripts/test_real_v30.cjs
          node scripts/test_practice_v26.cjs
          python scripts/test_curriculum_v21.py
          python scripts/test_curriculum_v20.py
          node --check _site/assets/mainline-v21.js
          node --check _site/assets/recorder-v19.js
          node --check _site/assets/listening-v18.js
          node scripts/test_recorder_v19.cjs
          node scripts/test_recorder_lifecycle_v19.cjs
          node scripts/test_recorder_scoring_v20.cjs
          node scripts/test_mainline_v20.cjs
          node scripts/test_mainline_v21.cjs
          node scripts/test_mainline_v19.cjs
          node scripts/test_mainline_stability.cjs
          node scripts/test_listening_stability.cjs
          node scripts/test_recorder_stability.cjs
          node scripts/test_legacy_audio_stability.cjs
      - name: Apply and validate Felix interview release
        run: |
          unzip -qo gospeak-v31-update.zip
          for mode in teaching mock review; do unzip -qo "gospeak-v31-$mode.zip"; done
          node scripts/test_real_v31.cjs
      - name: Verify state, city and reason interview rounds
        run: |
          unzip -qo gospeak-v32-update.zip
          node scripts/test_location_v32.cjs
      - name: Verify continuous location dialogue
        run: |
          unzip -qo gospeak-v33-update.zip
          python scripts/test_dialogue_v33.py
          node scripts/test_location_v32.cjs
          node --check _site/assets/location-listen-v33.js
          node --check _site/assets/cards-v24.js
          node --check _site/assets/listening-v18.js
      - name: Verify ordered interview practice and aligned answers
        run: |
          unzip -qo gospeak-v34-update.zip
          node scripts/test_v34.cjs
          python scripts/test_dialogue_v33.py
      - name: Verify opening questions, mock sequence and continuous listening
        run: |
          unzip -qo gospeak-v35-update.zip
          node scripts/test_v35.cjs
          python scripts/test_dialogue_v33.py
      - name: Verify four-turn opening interview and feedback
        run: |
          unzip -qo gospeak-v36-update.zip
          node scripts/test_v36.cjs
          node scripts/test_v35.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published iPad practice and continuous audio
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          deps="$RUNNER_TEMP/v35-browser"
          npm install --prefix "$deps" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$deps/node_modules/.bin/playwright" install --with-deps webkit
          NODE_PATH="$deps/node_modules" node scripts/verify_published_ipad_v36.cjs "${SITE_URL%/}/"
