          async def save(text, name, rate='-5%'):
              async with sem:
                  for attempt in range(3):
                      try:
                          target = out / name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          await edge_tts.Communicate(spoken(text), 'en-US-EmmaNeural', rate=rate).save(str(target))
                          return
                      except Exception:
                          if attempt == 2:
                              raise
                          await asyncio.sleep(1 + attempt)
          async def main():
