name: 发布 GoSpeak SWT 网站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 读取仓库
        uses: actions/checkout@v4
      - name: 解压网站
        run: mkdir _site && unzip -q gospeak-swt-week1-clean.zip -d _site
      - name: 生成月底口测句子课与连段训练
        run: |
          python -m pip install -q edge-tts
          python <<'PYAPP'
          import asyncio
          import re
          from pathlib import Path
          import edge_tts

          questions = [
              ('Please introduce yourself briefly.', [
                  'Hello, my name is Junxi.',
                  'I am a first-year student at Guangxi College for Preschool Education.',
                  'My major is Sports and Arts Performance, and I am responsible and willing to learn.',
                  'I also hold a lifeguard certificate from China.',
              ]),
              ('Why did you choose the United States?', [
                  'I chose the United States because I am interested in American culture.',
                  'I want to experience daily life there.',
                  'I hope to meet local people.',
                  'I also want to learn how people live and work.',
              ]),
              ('Why do you want to join the SWT program?', [
                  'I want to join the SWT program to experience American culture and daily life.',
                  'I hope to meet local people.',
                  'I also want to improve my English.',
                  'I want to become more independent.',
              ]),
              ('What kind of job are you interested in?', [
                  'I am interested in lifeguarding because I enjoy swimming.',
                  'I hold a lifeguard certificate from China.',
                  'I understand that I may need additional training in the United States.',
                  'I am willing to complete the training, and I am open to other suitable jobs.',
              ]),
          ]
          out = Path('_site/audio/mainline')
          words_out = out / 'words'
          words_out.mkdir(parents=True, exist_ok=True)
          sem = asyncio.Semaphore(10)
          def spoken(text):
              return text.replace('Junxi', 'Joon shee').replace('SWT', 'S W T')
          async def save(text, name, rate='-5%'):
              async with sem:
                  for attempt in range(3):
                      try:
                          await edge_tts.Communicate(spoken(text), 'en-US-EmmaNeural', rate=rate).save(str(out / name))
                          return
                      except Exception:
                          if attempt == 2:
                              raise
                          await asyncio.sleep(1 + attempt)
          async def main():
              jobs = []
              all_text = []
              for i, (question, lines) in enumerate(questions, 1):
                  all_text.extend(lines)
                  jobs.append(save(question, f'q{i:02d}.mp3'))
                  jobs.append(save(question, f'q{i:02d}-slow.mp3', '-20%'))
                  jobs.append(save(' '.join(lines), f'a{i:02d}.mp3'))
                  jobs.append(save(' '.join(lines), f'a{i:02d}-slow.mp3', '-20%'))
                  for j, line in enumerate(lines, 1):
                      jobs.append(save(line, f'a{i:02d}-l{j}.mp3'))
                      jobs.append(save(line, f'a{i:02d}-l{j}-slow.mp3', '-20%'))
                      chain = ' '.join(lines[:j])
                      jobs.append(save(chain, f'a{i:02d}-c{j}.mp3'))
                      jobs.append(save(chain, f'a{i:02d}-c{j}-slow.mp3', '-20%'))
              words = sorted(set(re.findall(r"[A-Za-z]+(?:-[A-Za-z]+)?", ' '.join(all_text))))
              for word in words:
                  safe = re.sub(r'[^a-z0-9-]+', '-', word.lower()).strip('-')
                  jobs.append(save(word, f'words/{safe}.mp3'))
              await asyncio.gather(*jobs)
          asyncio.run(main())

