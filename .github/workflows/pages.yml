              ("循环听今日题目，先抓关键词，再看中文。", "慢速听2遍、标准速听1遍；先抓学校、专业或SWT关键词。"),
              ("只记3个回答块，不背长篇范文。", "只补最多5个真实表达，不背长范文，不编经历。"),
              ("四句分别录音，听回放并按系统反馈重说。", "同题说3遍：看中英、只看关键词、完全隐藏；四句逐句录音。"),
