              ("I am a college student from China.", "I am a first-year student at Guangxi College for Preschool Education."),
              ("我是一名来自中国的大学生。", "我是广西幼儿师范高等专科学校的大一学生。"),
              ("I am friendly, responsible, and ready to learn.", "I am responsible and willing to learn."),
              ("我友善、有责任心，并愿意学习。", "我有责任心，并愿意学习。"),
              ("I enjoy swimming and meeting new people.", "I have a Chinese lifeguard certificate."),
              ("我喜欢游泳，也喜欢认识新朋友。", "我有中国游泳救生员证。"),
